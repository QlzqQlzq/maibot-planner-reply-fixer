[plugin]
enabled = true
config_version = "0.1.2"

[fixer]
enabled = true
models = ["spark-x2.6-4b"]       # 只对这些 planner 模型生效；留空 [] 表示不限制
tool_names = ["reply"]            # 允许兜底的工具名（必须是平台已注册的工具）
enabled_spec_parsing = true       # 解析「调用xxx工具：- key: value」这种文字说明
synth_reply_reference = true      # 缺 reply_reference 时用 focus/reply_act/tone 拼一句上下文说明
text_arg_names = ["text", "content", "message", "msg", "reply", "reply_text"]
dry_run = false                   # true = 只写日志不改写（观察用）
min_text_chars = 20
max_reply_chars = 120
# 「决定静默」的否定信号（命中即放弃兜底）
silence_keywords = ["不进行工具调用", "不调用", "保持静默", "保持沉默", "无需回复", "不需要回复", "不回复", "不发言", "不必回复", "wait"]
